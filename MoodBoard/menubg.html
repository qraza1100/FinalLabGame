  for(let k=0;k<22;k++){const a=k/22*Math.PI*2+r()*0.12,L=38+r()*9;
    const l=document.createElementNS(NS,'line');
    l.setAttribute('x1',(50+18*Math.cos(a)).toFixed(1));l.setAttribute('y1',(50+18*Math.sin(a)).toFixed(1));
    l.setAttribute('x2',(50+L*Math.cos(a)).toFixed(1));l.setAttribute('y2',(50+L*Math.sin(a)).toFixed(1));us.appendChild(l);
    const t=document.createElementNS(NS,'circle');t.setAttribute('cx',(50+L*Math.cos(a)).toFixed(1));t.setAttribute('cy',(50+L*Math.sin(a)).toFixed(1));
    t.setAttribute('r','1.9');t.setAttribute('fill','#FF6B6B');t.setAttribute('stroke','none');us.appendChild(t);}
  document.querySelectorAll('g.chev').forEach(function(g){
    const x0=+g.dataset.x,y0=+g.dataset.y,c=+g.dataset.cols,rw=+g.dataset.rows,dx=+g.dataset.dx,dy=+g.dataset.dy;let d='';
    for(let i=0;i<rw;i++)for(let j=0;j<c;j++){const x=x0+j*dx+(i%2)*10,y=y0+i*dy;d+='M'+x+','+(y-7)+' l8,7 l-8,7 ';}
    const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('stroke','#3DF5E0');p.setAttribute('stroke-opacity','.45');
    p.setAttribute('stroke-width','3');p.setAttribute('fill','none');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');g.appendChild(p);
  });
})();
</script></body></html>
